modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Server-side only: clients without the mod can still join.
displayTest="IGNORE_ALL_VERSION"

# PrismLauncher renders a short description (<287 chars) as HTML with working links; the
# leading <a> tag is enough for it to detect HTML. In game, ChatFormatModListDescription
# swaps these lines for the same links as clickable text.
description='''By <a href="https://discord.com/users/990003604725321808">arthou</a><br>Chat format inspired by Essentials Chat, made for DUSMP.<br><a href="https://discord.gg/sSpj3pQw5Y">Discord</a> &bull; <a href="https://chat.arthou.xyz">Documentation</a>'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
